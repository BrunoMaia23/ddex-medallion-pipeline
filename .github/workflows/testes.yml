name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # as pontas da faixa suportada (o Docker cobre o 3.12)
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instala o pacote
        run: pip install -e ".[dev]"

      - name: DAG de exemplo (só a sintaxe)
        run: python -m py_compile dags/dag_ddex_pipeline.py

      - name: Testes unitários e de pipeline (Spark + Iceberg)
        run: pytest -q

      - name: Demo completa
        run: python -m ddexpipe demo --base /tmp/demo
